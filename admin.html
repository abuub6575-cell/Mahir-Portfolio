<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Admin Login</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: Arial, sans-serif;
        }

        body {
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            background: #0a0a0a;
            color: white;
        }

        .login-box {
            width: 380px;
            padding: 35px;
            background: #151515;
            border: 1px solid #333;
            border-radius: 15px;
            box-shadow: 0 0 30px rgba(255, 0, 0, 0.15);
        }

        h1 {
            text-align: center;
            margin-bottom: 10px;
        }

        .subtitle {
            text-align: center;
            color: #aaa;
            margin-bottom: 30px;
        }

        label {
            display: block;
            margin-bottom: 8px;
        }

        input {
            width: 100%;
            padding: 13px;
            margin-bottom: 20px;
            border: 1px solid #444;
            border-radius: 8px;
            background: #0d0d0d;
            color: white;
            outline: none;
        }

        button {
            width: 100%;
            padding: 13px;
            border: none;
            border-radius: 8px;
            background: #e00000;
            color: white;
            font-size: 16px;
            cursor: pointer;
        }

        button:hover {
            background: #ff1a1a;
        }

        #message {
            margin-top: 15px;
            text-align: center;
        }

        .back {
            display: block;
            margin-top: 20px;
            text-align: center;
            color: #aaa;
            text-decoration: none;
        }
    </style>
</head>

<body>

    <div class="login-box">

        <h1>Admin Login</h1>

        <p class="subtitle">
            Mahir Elite2 Portfolio
        </p>

        <label>Username</label>

        <input
            type="text"
            id="username"
            placeholder="Enter username"
        >

        <label>Password</label>

        <input
            type="password"
            id="password"
            placeholder="Enter password"
        >

        <button onclick="login()">
            Login
        </button>

        <p id="message"></p>

        <a href="index.html" class="back">
            ← Back to Portfolio
        </a>

    </div>


    <script>

        function login() {

            const username =
                document.getElementById("username").value;

            const password =
                document.getElementById("password").value;

            const message =
                document.getElementById("message");


            // ADMIN LOGIN DETAILS

            const correctUsername = "mahir";

            const correctPassword = "MOHO4412";
            if (
                username === "mahir" &&
                password === "MOHO4412"
            ) {

                message.style.color = "lightgreen";

                message.innerHTML =
                    "Login successful!";


                // Save login session

                sessionStorage.setItem(
                    "adminLoggedIn",
                    "true"
                );


                // Open admin dashboard

                setTimeout(function() {

                    window.location.href =
                        "admin-dashboard.html";

                }, 1000);

            }

            else {

                message.style.color = "red";

                message.innerHTML =
                    "Username or password is incorrect.";

            }

        }

    </script>

</body>
</html>
